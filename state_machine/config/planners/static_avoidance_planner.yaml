min_horizon: 0.0
# Kept aligned with the GB-track max_horizon (15 m) so the static-path free-check (when used)
# validates the obstacle over the same window the SM commits in. The static commit itself no longer
# uses this (it gates on a fresh on-spline path), so this is just consistency/future-proofing.
max_horizon: 15.0
lateral_width_m: 0.1
free_scaling_reference_distance_m: 2.0
# The single-threaded state_machine executor runs ~0.3-0.5 s behind on the static-spline messages
# (it re-runs the heavy vel profiler on every 20 Hz avoidance msg), so measured against the SM clock
# a perfectly-fresh 20 Hz spline reads as 0.3-0.5 s "old". At 0.1 s the freshness gate NEVER passed
# and the car never committed to OVERTAKE (it trailed/crawled to the obstacle). 0.6 s tolerates the
# executor lag; a static obstacle's escape path does not go stale in 0.6 s (car moves < ~4 m).
# Raised 0.6 -> 1.0 when this value was compensation for executor lag rather than a staleness
# budget: the car slow-trailed a feasible-but-uncommitted obstacle to a collision (g_near 0.44 m)
# because the freshness gate intermittently exceeded 0.6 s of lag, so the OVERTAKE commit never
# sustained.
#
# Now 0.5, the value it should have been. Three things had to land first, and all three have:
#   * the SM caches the velocity profile of a geometrically frozen path instead of re-solving
#     calc_vel_profile on every 20 Hz republish, which is what produced the 0.3-0.5 s lag;
#   * adoption happens in ONE place (update_waypoints) rather than also as a side effect of the
#     freshness check, so a path being adopted no longer depends on which gate ran first;
#   * a forward re-slice of an already-committed path is adopted every cycle, so the cached path
#     tracks the car instead of ageing in place for up to hyst_timer_sec.
# The last one matters most here: what this threshold guards against is acting on a path that no
# longer describes where the car is, and that is now handled by adopting the re-slice rather than
# by tolerating a stale one. A 1.0 s window also tolerates a path that IS genuinely stale.
#
# If the sim run shows static_OT commits failing on freshness -- the "static_OT check: ... age="
# log line is the measurement -- this is the first value to put back.
latest_threshold: 0.5
hyst_timer_sec: 4.0
killing_timer_sec: 10.0
on_spline_front_horizon_thres_m: 0.5
# Car-to-spline distance below which we count as "on the spline". The controller tracks the raceline
# with ~0.5 m lateral error, so at 0.5 m this gate sat right on the boundary (min_dist=0.51) and
# rejected the commit. 0.85 m clears the tracking error while still requiring the car be near the path.
on_spline_min_dist_thres_m: 0.85
is_closed: False
