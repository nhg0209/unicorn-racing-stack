# LiDAR-frame ground plane from GLIM. Merge into kiss_icp_localization params
# (or pass each as -p). Crops the localization INPUT scan to the same z-band
# as map_ground.pcd ([0.02, 0.5] m above ground).
/**:
  ros__parameters:
    crop_ground_mode: "sensor"
    crop_ground_normal: [-0.267305, -0.012933, 0.963525]
    crop_ground_offset: 0.129741
    crop_z_min: 0.15
    crop_z_max: 0.5
