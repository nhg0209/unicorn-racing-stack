# LiDAR-frame ground plane from GLIM. Merge into kiss_icp_localization params
# (or pass each as -p). Crops the localization INPUT scan to the same z-band
# as map_ground.pcd ([0.1, 0.3] m above ground).
/**:
  ros__parameters:
    crop_ground_mode: "off"
    crop_ground_normal: [-0.257637, -0.011867, 0.966169]
    crop_ground_offset: 0.137800
    crop_z_min: 0.15
    crop_z_max: 0.3
