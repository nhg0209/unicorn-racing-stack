# Lane-hold dynamic overtaking planner (lane_change_planner / change_avoidance_node,
# launched as planner_change in race.launch.xml). All values live-tunable via rqt.
#
# Maneuver: the planner stays SILENT while TRAILING closes in at speed; once the gap
# is below engage_gap_m it latches a side, sizes the lane offset from the opponent's
# actual lateral position (never below the SM free-check requirement), blends onto the
# centerline-parallel lane (OPEN), keeps following it while watching the wrapped
# s-gap (HOLD, offset auto-grows if the opponent drifts toward the lane), and ramps
# back to the raceline once the opponent is passed (CLOSE).
planner_change:
  ros__parameters:
    # gate: only ENGAGE inside overtaking sectors (/ot_section_check fresh + true).
    # A maneuver already in progress is never aborted by sector state.
    require_ot_section: true

    # --- engagement ---
    engage_gap_m: 5.0          # trail (at speed) until the s-gap to the target is below
                               # this, then start the lane change. Must be ABOVE the
                               # trailing hold distance (controller: 0.25*v + 1.55 m,
                               # ~2-3 m) or the gap never closes enough to engage,
                               # and BELOW the SM commit gate (10 m).
    obs_traj_tresh: 1.0        # engage only if |obs d - ego d| below this (they block our line)
    sep_margin_m: 0.42          # required lateral clearance beyond the obstacle half-size.
                               # COUPLED to the SM: _check_free_frenet accepts the lane only if
                               #   min_dist - obs.size/2 - gb_ego_width_m/2 >= lateral_width_m
                               # i.e. sep_margin_m >= 0.20 + 0.20 = 0.40, with gb_ego_width_m from
                               # state_machine_params.yaml and lateral_width_m from
                               # state_machine/config/planners/dynamic_avoidance_planner.yaml.
                               # Below that the planner publishes a lane the SM then rejects and
                               # the car trails forever. 0.45 keeps 0.05 m of slack for the
                               # opponent drifting between the planner snapshot and the SM check.
                               # Keep the slack SMALL: with the s-varying lane the pass is
                               # separation-limited, so every cm here costs feasibility --
                               # on ifac 0.42 still gives 49% of the lap; 0.45 drops it to 37%.
    # --- lane profile solver ---
    # The lane is an s-varying profile inside the track corridor, not a constant offset from
    # the centerline. A constant offset had to clear the walls AND the opponent at every
    # sample of the pass window, so the narrowest point in the next few metres vetoed the
    # maneuver even when the opponent was nowhere near it: 8% of the ifac lap admitted a pass.
    # Requiring the opponent clearance only where the pass actually overlaps them -- which is
    # all the SM free-check ever reads, one point at argmin|s - obs_s| -- takes the same
    # margins to 40% of the lap.
    pass_overlap_m: 0.55       # [m] +-s around the meeting point where lateral clearance is
                               # enforced. The cars are 0.55 m long, so their bodies overlap
                               # exactly while |ds| < 0.55 -- this is the physical figure, not
                               # a margin. Every extra cm is run-up taken away from the lane
                               # change, so padding it here is paid for twice.
    opp_pred_slack_m: 0.20     # [m] how far the GP prediction may move the opponent SIDEWAYS
                               # beyond what its measured vd explains over the time-to-meet.
                               # The tracker's measured d is the anchor; the prediction refines
                               # it. A diverged GP fit otherwise returns a line swinging metres
                               # and blocks both sides of the track at once.
    pass_hold_max_m: 12.0      # [m] cap on how far past the meeting point the pass offset is
                               # held. Drawing level is not passing: the lane must stay out
                               # until the ego is pass_gap_m clear, which takes several metres
                               # of track at realistic closing speeds. Returning earlier steers
                               # back into the opponent and makes the SM free-check flap between
                               # TRAILING and OVERTAKE. The return itself is CLOSE's job.
    pass_lead_max_s: 5.0       # [s] cap on the predicted time-to-meet. Guards a near-zero
                               # closing speed from projecting the meeting point a whole lap
                               # away; if it lands past the solve horizon the engage is
                               # refused rather than accepted with nothing checked.
    lane_max_slope: 0.35       # PREFERRED max |dd/ds| of the lane (19 deg heading). The
                               # solver tries this first.
    lane_max_slope_close: 0.55 # ...and escalates to this (29 deg) ONLY when nothing fits at
                               # the preferred one -- a close trailing gap, where the whole
                               # lane change has to fit in gap - pass_overlap_m. At a fixed
                               # 0.35 a pass from 1.8 m was refused everywhere on the lap.
                               # The cap is not a grip limit: the SM re-plans the avoidance
                               # path's velocity from its curvature, so a steeper lane costs
                               # pass SPEED. It is not free either -- the lane stays on the
                               # raceline as long as the rate allows, so a globally higher cap
                               # makes every pass move later and sharper. Hence try-then-escalate.

    lane_offset_m: 0.35        # RVIZ REFERENCE LANES ONLY -- has no effect on the planned
                               # path. The lane is an s-varying profile: at each s it is
                               # pushed out only as far as the opponent clearance and the
                               # walls require, so a constant floor would only cost feasibility.
    offset_slew_mps: 0.6       # how fast the live offset may grow/shrink [m/s]
    spline_bound_mindist: 0.12 # path may never come closer than this to the track bounds

    # --- transition geometry (lengths speed-scale: max(min_m, time_s * v)) ---
    open_ramp_min_m: 3.0
    open_ramp_time_s: 0.8      # (the OPEN blend is additionally capped to finish BEFORE
                               # the target when engaging close behind it)
    blend_min_m: 1.5           # HOLD re-anchor blend from the car onto the lane
    close_ramp_min_m: 3.0
    close_ramp_time_s: 0.8
    close_arm_m: 1.0           # return ramp starts this far ahead of the car (slides while
                               # the car is still on the lane -> SM adoption is step-free)
    tail_m: 2.0                # raceline tail after the return ramp

    # --- hold / pass logic ---
    hold_horizon_m: 22.0       # published path length. Keep > SM interest_horizon_m (20):
                               # an opponent past the path end makes the SM free-check fail.
    pass_gap_m: 1.2            # ego must lead the opponent by this (wrapped s) to close
    pass_hyst_s: 0.3           # pass condition must hold this long (anti flicker)
    target_lost_s: 1.0         # coast the target on its EKF velocity this long before
                               # treating it as lost (occlusion robustness)
    reengage_block_s: 1.0      # idle time after finishing/aborting a maneuver

    # --- opponent prediction (P1 temporal, P2 spatial GP) ---
    use_prediction: false          # master toggle; false = react to the opponent's CURRENT
                                  # position only (pre-P1/P2 behavior), for A/B testing
    kd_obs_pred: 1.0              # d->raceline relaxation gain for the adaptive time-forward
                                  # propagation. higher = assume a near-line opponent returns
                                  # to its line faster; a far-off-line opponent relaxes less
    pred_lead_scale: 0.5         # lead time = (s-gap / closing-speed) * this. 0 disables the
                                  # time-forward part (offset/clearance still use GP d(s))

    # --- engage gating (NOT a prediction feature: reads the tracker's measured vs) ---
    engage_min_closing_mps: -0.5  # don't ENGAGE on an opponent pulling away faster than this
                                  # (m/s, ego_vs - opp_vs). Set very negative (-3.0) to disable;
                                  # this parameter is its own off-switch.
                                  # NOTE: this is NOT the same value as the SM's getting_closer
                                  # gate (state_machine_params.yaml: getting_closer_rel_vel_mps,
                                  # currently -0.1). The planner is the looser of the two, so the
                                  # SM gate binds first; an earlier comment here claimed they
                                  # matched, which they never did. Deliberately kept looser --
                                  # the planner may prepare a lane the SM has not committed to.
