/**:
  ros__parameters:
    wheelbase: 0.333
    scan_topic: 'scan'
    odometry_topic: 'vesc/odom'

urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    ip_address: "192.168.0.10"
    ip_port: 10940
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: true
    publish_multiecho: false
    cluster: 1
    skip: 0

vesc/**:
  ros__parameters:
    # Fallback only — low_level.launch.xml overrides this with the vesc_port arg
    # ($(env VESC_PORT /dev/ttyACM0)). USB serial names differ per machine/OS, so set
    # VESC_PORT in unicorn.local.sh (mac: /dev/cu.usbmodem*, Linux: /dev/ttyACM* or a
    # stable /dev/serial/by-id/... path) instead of editing this shared file.
    port: "/dev/ttyACM0"
    publish_tf: false
    brake_max: 200000.0
    brake_min: -20000.0
    current_max: 130.0
    current_min: 0.0
    duty_cycle_max: 0.0
    duty_cycle_min: 0.0
    position_max: 0.0
    position_min: 0.0
    servo_max: 1.0
    servo_min: 0.0
    speed_max: 69000.0
    speed_min: -69000.0
    speed_to_erpm_gain: 3447.54
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: 0.53
    steering_angle_to_servo_offset: 0.575
    use_servo_cmd_to_calc_angular_velocity: true
