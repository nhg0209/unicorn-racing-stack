# Vehicle dynamics model parameters (single-track model). Same format as the SIM
# copy; tune these to the real car's measured values when available.
mu: 1.0  # surface friction coefficient
C_Sf: 5.035741752330491 # Cornering stiffness coefficient, front
C_Sr: 9.618871913816136 # Cornering stiffness coefficient, rear
lf: 0.162 # Distance from center of gravity to front axle
lr: 0.145 # Distance from center of gravity to rear axle
h: 0.014 # Height of center of gravity
m: 3.54 # Total mass of the vehicle
I: 0.05797 # Moment of inertial of the entire vehicle about the z axis
s_min: -0.4189 # Minimum steering angle constraint
s_max: 0.4189 # Maximum steering angle constraint
sv_min: -3.2 # Minimum steering velocity constraint
sv_max: 3.2 # Maximum steering velocity constraint
v_switch: 7.319 # Switching velocity (velocity at which the acceleration is no longer able to create wheel spin)
a_max: 3.0 # Maximum longitudinal acceleration
v_min: -5.0 # Minimum longitudinal velocity
v_max: 20.0 # Maximum longitudinal velocity
width: 0.2032 # width of the vehicle in meters
length: 0.58 # length of the vehicle in meters
